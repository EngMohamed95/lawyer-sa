name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  # يسمح بتشغيل النشر يدوياً من تبويب Actions عند الحاجة
  workflow_dispatch:

# نشرة واحدة في كل مرة — يمنع تداخل رفعتين على نفس الخادم
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install PHP Mailer
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Type Check
        # نُفشل النشر قبل الرفع لا بعده — أرخص من نشر نسخة مكسورة
        run: npx tsc --noEmit

      - name: Build Project
        env:
          # عنوان تطبيق Web App (Node) المنفصل الذي يستضيف /api/* — عام وليس سرّاً،
          # الموقع الثابت الحالي لا يشغّل Node فانتقل الخادم لنطاق فرعي مستقل.
          # يُضبط من Settings → Secrets and variables → Actions → Variables
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          mkdir -p public
          cp logo.png public/logo.png || true
          npm run build

          # مُشغّل احتياطي: لو فشل استيراد الخادم نُظهر السبب بدل صفحة بيضاء
          cat > index.js <<'EOF'
          import http from 'http';
          import fs from 'fs';
          import('./dist/server.js').catch((err) => {
            fs.writeFileSync('startup-error.log', String(err.stack || err));
            const port = process.env.PORT || 3000;
            http.createServer((req, res) => {
              res.writeHead(500, {
                'Content-Type': 'application/json',
                'Access-Control-Allow-Origin': '*',
              });
              res.end(JSON.stringify({
                error: 'Server Startup Failed',
                details: String(err.message || err),
              }));
            }).listen(port);
          });
          EOF

          printf 'NODE_ENV="production"\n' > .env
          printf 'GEMINI_API_KEY="%s"\n' '${{ secrets.GEMINI_API_KEY }}' >> .env

      - name: Prepare Release Folder
        # نبني نسخة الخادم كما يتوقعها Hostinger:
        #   الجذر: index.js + package.json + .env + محتوى dist مسطّحاً
        #   ونُبقي dist/ كاملاً لأن start script يشير إلى dist/server.js
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          # عبر env لا داخل السكربت: JSON المفتاح مليء بعلامات " التي كانت تكسر شرط if
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASS: ${{ secrets.SMTP_PASSWORD }}
          DB_NAME: ${{ secrets.MYSQL_DATABASE }}
          DB_USER: ${{ secrets.MYSQL_USER }}
          DB_PASS: ${{ secrets.MYSQL_PASSWORD }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -e
          rm -rf release
          mkdir -p release

          cp package.json composer.json index.js .env release/
          cp -r dist release/dist
          cp -r vendor release/vendor

          # تسطيح محتوى dist في الجذر (نفس ما كان unzip.php يفعله)
          cp -r dist/. release/

          # مفتاح حساب الخدمة من الأسرار — اختياري
          # (التسجيل الذاتي signup.php يحتاجه — .htaccess يمنع تقديمه للمتصفح)
          if [ -n "$SA_KEY" ]; then
            printf '%s' "$SA_KEY" > release/serviceAccountKey.json
            # نتأكد أنه JSON صالح بالحقول المطلوبة — وإلا نُفشل النشر بدل نشر مفتاح تالف
            node -e '
              const k = JSON.parse(require("fs").readFileSync("release/serviceAccountKey.json", "utf8"));
              if (!k.client_email || !k.private_key || !k.private_key_id) throw new Error("حقول ناقصة");
            ' || { echo "❌ سرّ FIREBASE_SERVICE_ACCOUNT_KEY ليس JSON صالحاً"; exit 1; }
            echo "أُضيف مفتاح حساب الخدمة."
          else
            echo "تنبيه: لا يوجد سرّ FIREBASE_SERVICE_ACCOUNT_KEY — تُنشر الحزمة بدونه."
          fi

          # مفاتيح وسيط الذكاء الاصطناعي (ai-proxy.php) — تُكتب وقت النشر فقط ولا تدخل المستودع.
          # .htaccess يمنع تقديم الملف للمتصفح. المفاتيح حروف وأرقام و . _ - فقط (مفاتيح Gemini
          # الجديدة تبدأ بـ "AQ.")، فنرفض أي شيء آخر — لا علامة اقتباس تكسر نص PHP.
          if [ -n "$GEMINI_KEY" ] || [ -n "$GROQ_KEY" ]; then
            for k in "$GEMINI_KEY" "$GROQ_KEY"; do
              if [ -n "$k" ] && ! printf '%s' "$k" | grep -Eq '^[A-Za-z0-9._-]+$'; then
                echo "صيغة مفتاح الذكاء الاصطناعي غير متوقعة"; exit 1
              fi
            done
            {
              echo "<?php"
              echo "return ["
              echo "  'gemini_key' => '$GEMINI_KEY',"
              echo "  'groq_key' => '$GROQ_KEY',"
              echo "  'firebase_project_id' => 'lawyer-sa',"
              echo "];"
            } > release/ai-config.php
            echo "أُضيف ملف مفاتيح الذكاء الاصطناعي."
          else
            echo "تنبيه: لا يوجد سرّ GEMINI_API_KEY — الذكاء الاصطناعي لن يعمل على اللايف."
          fi

          # بريد النظام يخرج عبر SMTP موثّق حتى تمر الرسائل عبر SPF/DKIM ولا تعتمد
          # على PHP mail(). بيانات الدخول تُحقن من GitHub Secrets وقت النشر فقط.
          if [ "$SMTP_USER" != "no-reply@mawazzen.com" ] || [ -z "$SMTP_PASS" ]; then
            echo "❌ أضف SMTP_USERNAME=no-reply@mawazzen.com وSMTP_PASSWORD إلى GitHub Secrets"
            exit 1
          fi
          smtp_user_b64=$(printf '%s' "$SMTP_USER" | base64 -w0)
          smtp_pass_b64=$(printf '%s' "$SMTP_PASS" | base64 -w0)
          {
            echo "<?php"
            echo "return ["
            echo "  'host' => 'smtp.hostinger.com',"
            echo "  'port' => 465,"
            echo "  'username' => base64_decode('$smtp_user_b64'),"
            echo "  'password' => base64_decode('$smtp_pass_b64'),"
            echo "];"
          } > release/mail-config.php
          echo "أُضيف إعداد SMTP الموثّق."

          # قاعدة MySQL — تسجيل الدخول صار يعتمد عليها (public/api). بدونها الدخول يتعطل
          # على اللايف، فنوقف النشر بدل ما ننشر نسخة مكسورة. MySQL على نفس خادم Hostinger
          # فالاتصال 127.0.0.1. القيم تمر base64 فما في علامة اقتباس تكسر نص PHP.
          if [ -z "$DB_NAME" ] || [ -z "$DB_USER" ] || [ -z "$DB_PASS" ] || [ -z "$APP_URL" ]; then
            echo "❌ أضف MYSQL_DATABASE وMYSQL_USER وMYSQL_PASSWORD وAPP_URL إلى GitHub Secrets"
            echo "   (وطبّق database/schema.sql على قاعدة Hostinger قبل أول نشر)"
            exit 1
          fi
          b64() { printf '%s' "$1" | base64 -w0; }
          {
            echo "<?php"
            echo "return ["
            echo "  'host' => '127.0.0.1',"
            echo "  'port' => 3306,"
            echo "  'name' => base64_decode('$(b64 "$DB_NAME")'),"
            echo "  'user' => base64_decode('$(b64 "$DB_USER")'),"
            echo "  'pass' => base64_decode('$(b64 "$DB_PASS")'),"
            echo "  'app_url' => base64_decode('$(b64 "$APP_URL")'),"
            echo "  'firebase_project_id' => 'lawyer-sa',"
            echo "  'rotate_firebase_passwords' => true,"
            echo "  'cookie_secure' => true,"
            echo "];"
          } > release/db-config.php
          echo "أُضيف إعداد قاعدة MySQL."

          # مجلد رفع المستخدمين يجب أن يوجد ولا يُمسّ محتواه لاحقاً
          mkdir -p release/uploads

          echo "--- محتوى النشرة ---"
          ls -la release | head -25
          echo "عدد الملفات: $(find release -type f | wc -l)"

      - name: Install lftp
        continue-on-error: true
        timeout-minutes: 2
        run: timeout 90s sudo apt-get install -y -qq lftp

      - name: Upload to Hostinger via FTP
        env:
          FTP_HOST: ftp.mawazzen.com
          FTP_USER: ${{ secrets.HOSTINGER_USERNAME }}
          FTP_PASS: ${{ secrets.HOSTINGER_PASSWORD }}
        run: |
          set -e

          # الاستضافة تشترط FTPS صريحاً على قناتَي التحكم والبيانات.
          # ssl-allow وحده يسمح ولا يفرض، فتبقى قناة البيانات بلا حماية
          # ويرفضها الخادم — وهذا ما استنفد المحاولات سابقاً.
          # (curl القديم كان ينجح لأن --ssl-reqd يفرضها.)
          cat > /tmp/lftprc <<'RC'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-protect-list true
          set ssl:verify-certificate no
          set ftp:passive-mode true
          set net:max-retries 5
          set net:timeout 30
          set net:reconnect-interval-base 5
          set xfer:clobber on
          RC

          # اتصال تشخيصي أولاً: يفصل فشل الاتصال عن فشل النقل
          if command -v lftp >/dev/null 2>&1; then
            lftp -f /dev/stdin <<EOF
            source /tmp/lftprc
            open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
            pwd
            ls
            bye
          EOF
            echo "✓ الاتصال بالـ FTP سليم"
          else
            echo "⚠️ lftp غير متاح — سيتم الرفع مباشرة عبر curl"
          fi

          # نقل متسلسل: الاستضافات المشتركة تحدّ الاتصالات المتزامنة.
          # index.html يُرفع أخيراً: لو سبق ملفات assets/ لطلب المتصفح ملفات لم تصل بعد
          # فيظهر «Failed to fetch dynamically imported module» لمن يفتح الموقع أثناء النشر.
          # لا نستخدم --delete: على الخادم ملفات لا تأتي من المستودع
          # (مستندات المستخدمين في uploads/) وحذفها يعني فقدانها.
          if command -v lftp >/dev/null 2>&1 && lftp -f /dev/stdin <<EOF
          source /tmp/lftprc
          open -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          mirror --reverse --parallel=1 --verbose=1 \
                 --exclude '^uploads/' \
                 --exclude '^dist/uploads/' \
                 --exclude '^index\.html$' \
                 release/ ./
          put release/index.html -o index.html
          bye
          EOF
          then
            echo "✓ الرفع تم عبر lftp"
          else
            echo "⚠️ فشل lftp — نتحوّل إلى curl (أثبت نجاحه مع هذه الاستضافة)"
            # نرفع ملفاً ملفاً، وننشئ المجلدات ضمنياً بـ --ftp-create-dirs
            failed=0
            while IFS= read -r f; do
              rel="${f#release/}"
              case "$rel" in uploads/*|dist/uploads/*) continue ;; esac
              if ! curl -sS -k --ssl-reqd --ftp-create-dirs \
                        --retry 3 --retry-delay 3 --max-time 120 \
                        -T "$f" -u "$FTP_USER:$FTP_PASS" \
                        "ftp://$FTP_HOST/$rel"; then
                echo "❌ تعذّر رفع $rel"
                failed=$((failed + 1))
              fi
            done < <(find release -type f ! -path release/index.html; echo release/index.html)

            if [ "$failed" -gt 0 ]; then
              echo "فشل رفع $failed ملف"
              exit 1
            fi
            echo "✓ الرفع تم عبر curl"
          fi

      - name: Restart Node App
        env:
          FTP_HOST: ftp.mawazzen.com
          FTP_USER: ${{ secrets.HOSTINGER_USERNAME }}
          FTP_PASS: ${{ secrets.HOSTINGER_PASSWORD }}
        run: |
          # Hostinger يعيد تشغيل تطبيق Node عند لمس tmp/restart.txt
          date > restart.txt
          # curl مباشرةً: أبسط وأثبت من lftp لملف واحد، و--ftp-create-dirs
          # ينشئ tmp/ إن لم يوجد
          curl -sS -k --ssl-reqd --ftp-create-dirs \
               --retry 3 --retry-delay 3 --max-time 60 \
               -T restart.txt -u "$FTP_USER:$FTP_PASS" \
               "ftp://$FTP_HOST/tmp/restart.txt"
          echo "✓ أُرسلت إشارة إعادة التشغيل"

      - name: Verify Deployment
        env:
          FTP_HOST: ftp.mawazzen.com
          FTP_USER: ${{ secrets.HOSTINGER_USERNAME }}
          FTP_PASS: ${{ secrets.HOSTINGER_PASSWORD }}
        # التحقق يتم عبر FTP لا HTTPS.
        #
        # حماية البوتات على الاستضافة ترد بصفحة تحدّي JavaScript لطلبات
        # عناوين GitHub Actions، فلا تحوي الاستجابة أي إشارة للملفات ويبدو
        # النشر فاشلاً رغم نجاحه. أما FTP فقد أثبت عمله من نفس البيئة قبل
        # سطور — فنقرأ index.html المنشور منه مباشرةً ونقارن البصمة.
        run: |
          set -e
          expected=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          echo "المتوقع: $expected"

          curl -sS -k --ssl-reqd --retry 3 --retry-delay 3 --max-time 60 \
               -u "$FTP_USER:$FTP_PASS" \
               "ftp://$FTP_HOST/index.html" -o live-index.html

          live=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' live-index.html | head -1)
          echo "المنشور على الخادم: ${live:-لا شيء}"

          if [ "$live" = "$expected" ]; then
            echo "✅ النشر وصل وتأكّد — index.html على الخادم يطابق البناء."
            exit 0
          fi

          echo "❌ عدم تطابق: الخادم يحمل '${live:-لا شيء}' والمتوقع '$expected'"
          exit 1
